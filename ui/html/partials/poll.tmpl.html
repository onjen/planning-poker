{{ define "poll" }}
<div id="poll" hx-get="/poll" hx-trigger="newpoll from:body, joined from:body" hx-swap="outerHTML">
  {{ if .IsModerator }}
  <form hx-post="/poll" hx-target="#poll" hx-swap="outerHTML">
    <input type="text" name="poll" placeholder="What are we voting on?" value="{{ .Poll }}" required>
    <button type="submit">Set poll</button>
  </form>
  {{ else }}
  <label>
    Current poll
    <input type="text" readonly value="{{ .Poll }}">
  </label>
  {{ end }}
</div>
{{ end }}
